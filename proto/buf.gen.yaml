version: v2
inputs:
  - directory: .
plugins:
  - local: protoc-gen-go
    out: ../server/gen
    opt:
      - paths=source_relative
  - local: protoc-gen-connect-go
    out: ../server/gen
    opt:
      - paths=source_relative
  - local: protoc-gen-es
    out: ../client/src/gen
  - local: protoc-gen-connect-es
    out: ../client/src/gen
