version: v2
inputs:
  - directory: .
plugins:
  - local: protoc-gen-go
    out: ../server/pb
    opt:
      - paths=source_relative
  - local: protoc-gen-connect-go
    out: ../server/pb
    opt:
      - paths=source_relative
  - local: ../client/node_modules/.bin/protoc-gen-es
    out: ../client/src/pb
  - local: ../client/node_modules/.bin/protoc-gen-connect-es
    out: ../client/src/pb
