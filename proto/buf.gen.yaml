version: v2
inputs:
  - directory: .
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../server/gen
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go
    out: ../server/gen
    opt:
      - paths=source_relative
  - remote: buf.build/protocolbuffers/es
    out: ../client/src/gen
    opt:
      - target=ts
  - remote: buf.build/connectrpc/es
    out: ../client/src/gen
    opt:
      - target=ts
